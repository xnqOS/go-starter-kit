name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: starter
          POSTGRES_PASSWORD: starter
          POSTGRES_DB: starter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U starter -d starter_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CGO_ENABLED: "1"
      TEST_DATABASE_URL: postgres://starter:starter@localhost:5432/starter_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - name: Verify clean export and module rename
        run: |
          make init MODULE=example.com/ci-project DEST="$RUNNER_TEMP/ci-project"
          cd "$RUNNER_TEMP/ci-project"
          # In the template, test the export against this commit's kit. A project
          # created by make init has no kit/ and keeps the published version.
          if [ -f "$GITHUB_WORKSPACE/kit/go.mod" ]; then
            go mod edit -replace "github.com/xnqOS/go-starter-kit/kit=$GITHUB_WORKSPACE/kit"
          fi
          make module NAME=init_probe
          make check
          make build
      - name: Generate a module to verify templates and registration
        run: make module NAME=ci_probe
      - name: Test both databases, vet and build
        run: make check
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build, migrate and start the container
        run: |
          cp .env.deploy.example .env.deploy
          make deploy
      - name: Verify CRUD and persistence after container replacement
        run: |
          curl --fail --silent http://localhost:8080/health
          curl --fail --silent -X POST http://localhost:8080/api/v1/example \
            -H 'Content-Type: application/json' -d '{"name":"container smoke"}' > /tmp/created.json
          id=$(jq -r '.data.id' /tmp/created.json)
          test -n "$id" && test "$id" != null
          docker compose -f compose.deploy.yaml up -d --no-deps --force-recreate --wait api
          curl --fail --silent "http://localhost:8080/api/v1/example/$id" | jq -e '.data.name == "container smoke"'
      - name: Show container logs
        if: always()
        run: docker compose -f compose.deploy.yaml logs --no-color
      - name: Remove test containers and volumes
        if: always()
        run: docker compose -f compose.deploy.yaml down -v
